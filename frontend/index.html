<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Book appointment slots quickly and securely." />
    <title>Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260908_01" />
  </head>
  <body>
    <main class="page">
      <header class="top">
        <div>
          <h1>Appointments</h1>
          <p class="muted">Book an available appointment slot</p>
        </div>
        <div id="session" class="session hidden">
          <span id="greeting"></span>
          <button type="button" id="logout" class="secondary">Log out</button>
        </div>
      </header>

      <p id="banner" class="banner hidden" role="status"></p>

      <!-- ── Auth Section ──────────────────────────────── -->
      <section id="auth" class="auth-page">
        <div class="auth-card">
          <!-- Logo -->
          <div class="auth-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Appointments</span>
          </div>

          <!-- Title & Subtitle -->
          <h2 id="auth-title" class="auth-title">Log in to your account</h2>
          <p id="auth-subtitle" class="auth-subtitle">Welcome back! Please enter your details.</p>

          <!-- Tabs -->
          <div class="auth-tabs" id="auth-tabs">
            <button type="button" class="auth-tab active" data-tab="login">Log in</button>
            <button type="button" class="auth-tab" data-tab="signup">Sign up</button>
          </div>

          <!-- Inline message area -->
          <div id="auth-message" class="auth-message hidden" role="status"></div>

          <!-- ── Login Form ──────────────────────────── -->
          <form id="login-form" class="auth-form" novalidate>
            <div class="auth-input-group">
              <label for="login-email">Email</label>
              <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com" required />
              <span class="field-error" id="login-email-error"></span>
            </div>
            <div class="auth-input-group">
              <label for="login-password">Password</label>
              <input id="login-password" type="password" autocomplete="current-password" minlength="8" placeholder="••••••••" required />
              <span class="field-error" id="login-password-error"></span>
            </div>
            <div class="auth-row">
              <label class="auth-checkbox">
                <input type="checkbox" id="remember-me" />
                <span>Remember for 30 days</span>
              </label>
              <a href="#" class="auth-link" id="forgot-link">Forgot password</a>
            </div>
            <button type="submit" id="login-btn" class="auth-submit">Sign in</button>
            <p class="auth-divider">Don't have an account? <a href="#" class="auth-link" id="switch-to-signup">Sign up</a></p>
          </form>

          <!-- ── Signup Form ─────────────────────────── -->
          <form id="signup-form" class="auth-form hidden" novalidate>
            <div class="auth-input-group">
              <label for="signup-email">Email</label>
              <input id="signup-email" type="email" autocomplete="username" placeholder="you@example.com" required />
              <span class="field-error" id="signup-email-error"></span>
            </div>
            <div class="auth-input-group">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required />
              <span class="field-error" id="signup-password-error"></span>
            </div>
            <div class="auth-input-group">
              <label for="signup-confirm">Confirm password</label>
              <input id="signup-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required />
              <span class="field-error" id="signup-confirm-error"></span>
            </div>
            <button type="submit" id="signup-btn" class="auth-submit">Create account</button>
            <p class="auth-divider">Already have an account? <a href="#" class="auth-link" id="switch-to-login">Log in</a></p>
          </form>

          <!-- ── Forgot Password Form ────────────────── -->
          <form id="forgot-form" class="auth-form hidden" novalidate>
            <div class="auth-input-group">
              <label for="forgot-email">Email</label>
              <input id="forgot-email" type="email" autocomplete="username" placeholder="you@example.com" required />
              <span class="field-error" id="forgot-email-error"></span>
            </div>
            <button type="submit" id="forgot-btn" class="auth-submit">Send reset link</button>
            <p class="auth-divider"><a href="#" class="auth-link" id="back-to-login">← Back to log in</a></p>
          </form>

          <!-- ── Reset Password Form (from email link) ── -->
          <form id="reset-form" class="auth-form hidden" novalidate>
            <div class="auth-input-group">
              <label for="reset-password">New password</label>
              <input id="reset-password" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required />
              <span class="field-error" id="reset-password-error"></span>
            </div>
            <div class="auth-input-group">
              <label for="reset-confirm">Confirm new password</label>
              <input id="reset-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••" required />
              <span class="field-error" id="reset-confirm-error"></span>
            </div>
            <button type="submit" id="reset-btn" class="auth-submit">Set new password</button>
            <p class="auth-divider"><a href="#" class="auth-link" id="reset-back-to-login">← Back to log in</a></p>
          </form>
        </div>
      </section>

      <section id="app" class="hidden">
        <div class="grid">
          <article class="card">
            <div class="card-head">
              <h2>Available slots</h2>
              <button type="button" id="refresh-slots" class="secondary">Refresh</button>
            </div>
            <!-- Modern Calendar Widget -->
            <div id="calendar"></div>
            <!-- Slots for Selected Date -->
            <div id="slots-container">
              <div id="slots" class="list"></div>
            </div>
          </article>
          <article class="card">
            <div class="card-head">
              <h2>My appointments</h2>
              <button type="button" id="refresh-appts" class="secondary">Refresh</button>
            </div>
            <div id="appointments" class="list"></div>
          </article>
        </div>
      </section>
    </main>
    <script src="./app.js?v=20260908_02"></script>
  </body>
</html>
